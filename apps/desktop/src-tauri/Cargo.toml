[package]
name = "libreri-desktop"
description = "Libreri desktop app: the thin Tauri shell around the libreri-* crates."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "libreri_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libreri-core = { workspace = true, features = ["specta"] }
uuid.workspace = true
libreri-library.workspace = true
libreri-jobs.workspace = true
libreri-metadata = { workspace = true, features = ["specta"] }
libreri-scan = { workspace = true, features = ["specta"] }
libreri-helpers = { workspace = true, features = ["specta"] }
libreri-speech = { workspace = true, features = ["specta"] }
libreri-spell = { workspace = true, features = ["specta"] }
libreri-maths = { workspace = true, features = ["specta"] }
libreri-ocr = { workspace = true, features = ["specta"] }
libreri-voices = { workspace = true, features = ["specta"] }
libreri-links = { workspace = true, features = ["specta"] }
libreri-feeds = { workspace = true, features = ["specta"] }
libreri-pdf-edit = { workspace = true, features = ["specta"] }
libreri-search = { workspace = true, features = ["specta"] }
libreri-formats.workspace = true
libreri-thumbs.workspace = true
libreri-export = { workspace = true, features = ["specta"] }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tauri-plugin-opener = "2.5.5"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
